name: Practice account integration checks
on:
  pull_request:
    paths:
      - 'index.html'
      - 'server.js'
      - 'practice-accounts.js'
      - 'package*.json'
      - 'scripts/practice-integration-check.mjs'
      - '.github/workflows/practice-integration-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax-and-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check server.js
      - run: node --check practice-accounts.js
      - run: node --check scripts/practice-integration-check.mjs
      - run: node scripts/practice-integration-check.mjs
