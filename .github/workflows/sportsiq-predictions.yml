name: Save and grade Sports IQ predictions
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sportsiq-predictions.yml'
permissions:
  contents: write
concurrency:
  group: sportsiq-predictions
jobs:
  predictions:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: |
          git pull --ff-only origin main
          if python3 scripts/nba_pilot.py; then git add nba-pilot.json; fi
          python3 scripts/predictions.py
          git add predictions.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Save and grade pregame predictions'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Mirror NBA pilot archive into Neon (optional)
        # Failure must never interrupt or roll back existing Sports IQ updates.
        continue-on-error: true
        env:
          SPORTSIQ_NEON_DATABASE_URL: ${{ secrets.SPORTSIQ_NEON_DATABASE_URL }}
        run: |
          if [ -z "$SPORTSIQ_NEON_DATABASE_URL" ]; then
            echo "Neon pilot sync not configured; existing GitHub archive remains active."
            exit 0
          fi
          python3 -m pip install --quiet 'psycopg[binary]>=3.2,<4'
          python3 scripts/sync_nba_pilot_neon.py
