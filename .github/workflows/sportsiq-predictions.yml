name: Save and grade Sports IQ predictions
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sportsiq-predictions.yml'
permissions:
  contents: write
concurrency:
  group: sportsiq-predictions
jobs:
  predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: |
          git pull --ff-only origin main
          if python3 scripts/nba_pilot.py; then git add nba-pilot.json; fi
          python3 scripts/predictions.py
          git add predictions.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Save and grade pregame predictions'
          git pull --rebase origin main
          git push origin HEAD:main
